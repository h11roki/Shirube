name: Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-24.04
    env:
      SITE: ${{ vars.SITE_DOMAIN }}
      GH_TOKEN: ${{ github.token }}
      CERT_MIN_DAYS: 14
      DEPLOY_GRACE_MINUTES: 45
    steps:
      - name: トップとログインなしの API
        run: |
          curl -fsS --retry 3 --retry-all-errors --retry-delay 20 -o /dev/null "https://$SITE/"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://$SITE/api/plans")" = 401
      - name: health
        run: |
          health=$(curl -sS --retry 3 --retry-all-errors --retry-delay 20 "https://$SITE/api/health")
          echo "$health" | jq .
          echo "$health" > "$RUNNER_TEMP/health.json"
          jq -e '.status == "ok"' "$RUNNER_TEMP/health.json" > /dev/null
      - name: 証明書の残り
        run: |
          expiry=$(openssl s_client -servername "$SITE" -connect "$SITE:443" < /dev/null 2> /dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ($(date -d "$expiry" +%s) - $(date +%s)) / 86400 ))
          echo "証明書の残り $days 日"
          test "$days" -ge "$CERT_MIN_DAYS"
      - name: 本番が main に追いついているか
        if: always()
        run: |
          deployed=$(jq -r '.version' "$RUNNER_TEMP/health.json")
          read -r head committed < <(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha + " " + .commit.committer.date')
          behind=$(( ($(date +%s) - $(date -d "$committed" +%s)) / 60 ))
          echo "本番 $deployed、main $head($behind 分前)"
          test "$deployed" = "$head" || test "$behind" -lt "$DEPLOY_GRACE_MINUTES"
