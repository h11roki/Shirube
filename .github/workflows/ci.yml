name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shirube
          POSTGRES_PASSWORD: shirube
          POSTGRES_DB: shirube
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U shirube" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://shirube:shirube@localhost:5432/shirube
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ruff check --line-length 100 ../frontend/brand/make.py
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: git add --intent-to-add src/lib/api && git diff --exit-code -- src/lib/api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: pnpm test:e2e
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/e2e.log"
          for attempt in 1 2 3; do
            if pnpm test:e2e 2>&1 | tee "$log"; then
              exit 0
            fi
            if [ "$attempt" = 3 ] || ! grep -qE "requesting https://fonts\.(googleapis|gstatic)\.com/" "$log"; then
              exit 1
            fi
            echo "Google Fonts の取得で落ちたので流し直す($attempt 回目)"
            sleep 15
          done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
