name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shirube
          POSTGRES_PASSWORD: shirube
          POSTGRES_DB: shirube
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U shirube" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://shirube:shirube@localhost:5432/shirube
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ruff check --line-length 100 ../frontend/brand/make.py
      - run: uv run mypy
      - run: uv run pytest --cov --cov-fail-under=87
      - name: カバレッジを job の要約に書く
        if: ${{ !cancelled() && hashFiles('backend/.coverage') != '' }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - run: git add --intent-to-add src/lib/api && git diff --exit-code -- src/lib/api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      - name: カバレッジを job の要約に書く
        if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: |
          jq -r '.total | "| | % | 数 |\n|---|---|---|\n" + ([("statements", "branches", "functions", "lines") as $metric | "| \($metric) | \(.[$metric].pct) | \(.[$metric].covered)/\(.[$metric].total) |"] | join("\n"))' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm format:check
      - name: pnpm test:e2e
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/e2e.log"
          for attempt in 1 2 3; do
            if pnpm test:e2e 2>&1 | tee "$log"; then
              exit 0
            fi
            if [ "$attempt" = 3 ] || ! grep -qE "requesting https://fonts\.(googleapis|gstatic)\.com/" "$log"; then
              exit 1
            fi
            echo "Google Fonts の取得で落ちたので流し直す($attempt 回目)"
            sleep 15
          done
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --severity=warning deploy.sh backup.sh restore-drill.sh tests/deploy/run.sh tests/deploy/shims/*
      - run: tests/deploy/run.sh

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: 本番のイメージに入る backend の依存の既知の脆弱性
        working-directory: backend
        run: |
          uv export --locked --no-default-groups --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run --locked --only-group audit pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 本番のイメージに入る frontend の依存の既知の脆弱性(high 以上)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

  audit-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: 開発と取り込みも含む backend の依存の既知の脆弱性
        working-directory: backend
        run: |
          uv export --locked --all-groups --no-group audit --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uv run --locked --only-group audit pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 開発も含む frontend の依存の既知の脆弱性(high 以上)
        working-directory: frontend
        run: pnpm audit --audit-level high

  production:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SITE: shirube.localhost
    steps:
      - uses: actions/checkout@v7
      - name: 試しの値で .env を書く
        run: |
          {
            echo "SITE_DOMAIN=$SITE"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo OPENAI_API_KEY=sk-ci-unused
            echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo AUTH_GOOGLE_ID=ci-unused
            echo AUTH_GOOGLE_SECRET=ci-unused
          } > .env
      - run: docker compose -f compose.prod.yaml build
      - run: docker compose -f compose.prod.yaml up -d --wait db
      - run: docker compose -f compose.prod.yaml run --rm backend uv run --no-sync alembic upgrade head
      - run: docker compose -f compose.prod.yaml up -d --wait --wait-timeout 180
      - name: HTTPS のトップ、HSTS、ログインなしの API、health、ログインの戻り先、HTTP からの転送
        run: |
          resolve=(--resolve "$SITE:443:127.0.0.1" --resolve "$SITE:80:127.0.0.1")
          curl "${resolve[@]}" -fsSk --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null "https://$SITE/"
          curl "${resolve[@]}" -fsSk -D - -o /dev/null "https://$SITE/" | grep -i '^strict-transport-security: max-age=31536000'
          test "$(curl "${resolve[@]}" -sk -o /dev/null -w '%{http_code}' "https://$SITE/api/plans")" = 401
          curl "${resolve[@]}" -fsSk "https://$SITE/api/health" | jq -e '.status == "ok" and .database == "ok" and .version == "unknown"'
          curl "${resolve[@]}" -fsSk "https://$SITE/api/auth/providers" | grep -F "\"callbackUrl\":\"https://$SITE/api/auth/callback/google\""
          test "$(curl "${resolve[@]}" -s -o /dev/null -w '%{http_code}' "http://$SITE/")" = 308
      - name: バックアップ
        run: |
          ./backup.sh
          test "$(stat -c %a "$HOME"/backups/shirube-*.dump)" = 600
      - if: failure() || cancelled()
        run: docker compose -f compose.prod.yaml logs --no-color

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, scripts, audit, production]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shirube
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: runner
          build-args: SITE_URL=https://${{ vars.SITE_DOMAIN }}
          push: true
          tags: ${{ env.IMAGE }}-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
