name: shirube

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shirube
      POSTGRES_PASSWORD: shirube
      POSTGRES_DB: shirube
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shirube"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://shirube:shirube@db:5432/shirube
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: uv run --no-sync watchfiles --filter python --sigint-timeout 960 "python -m app.presentation.worker" app
    environment:
      DATABASE_URL: postgresql+psycopg://shirube:shirube@db:5432/shirube
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      SEARCH_BY_SKILL: ${SEARCH_BY_SKILL:-}
      SELECTION_VOTES: ${SELECTION_VOTES:-}
      SELECTION_VOTE_DELAY_SECONDS: ${SELECTION_VOTE_DELAY_SECONDS:-}
      OCCUPATION_READING_CACHE_SIZE: ${OCCUPATION_READING_CACHE_SIZE:-}
    volumes:
      - ./backend:/app
    stop_grace_period: 17m
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    environment:
      BACKEND_URL: http://backend:8000
      SITE_URL: ${SITE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      AUTH_URL: ${AUTH_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/app/.pnpm-store
    depends_on:
      - backend

volumes:
  db-data:
  frontend-node-modules:
  frontend-pnpm-store:
