name: shirube-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-timing: &healthcheck-timing
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 60s
  start_interval: 2s

x-site-url: &site-url https://${SITE_DOMAIN:?SITE_DOMAIN を .env に書いてください}

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://shirube:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に書いてください}@db:5432/shirube
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY を .env に書いてください}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  SEARCH_BY_SKILL: ${SEARCH_BY_SKILL:-}
  SELECTION_VOTES: ${SELECTION_VOTES:-}
  SELECTION_MIN_VOTES: ${SELECTION_MIN_VOTES:-}
  SELECTION_VOTE_DELAY_SECONDS: ${SELECTION_VOTE_DELAY_SECONDS:-}
  OCCUPATION_READING_CACHE_SIZE: ${OCCUPATION_READING_CACHE_SIZE:-}
  RECOMMENDATION_CACHE_DAYS: ${RECOMMENDATION_CACHE_DAYS:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shirube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に書いてください}
      POSTGRES_DB: shirube
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shirube"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./backend
    image: shirube-prod-backend
    pull_policy: never
    command: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    environment:
      <<: *backend-environment
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET を .env に書いてください}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      <<: *healthcheck-timing
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  worker:
    image: shirube-prod-backend
    pull_policy: never
    command: uv run --no-sync python -m app.presentation.worker
    environment:
      <<: *backend-environment
    stop_grace_period: 17m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        SITE_URL: *site-url
    image: shirube-prod-frontend
    pull_policy: never
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      <<: *healthcheck-timing
    environment:
      BACKEND_URL: http://backend:8000
      SITE_URL: *site-url
      AUTH_URL: *site-url
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET を .env に書いてください}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?AUTH_GOOGLE_ID を .env に書いてください}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?AUTH_GOOGLE_SECRET を .env に書いてください}
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
