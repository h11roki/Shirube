[project]
name = "shirube-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.1",
    "langchain-openai>=1.7.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.17.0",
    "types-reportlab>=5.0.0.20261008",
]
scraper = [
    "beautifulsoup4>=4.15.0",
    "pdfplumber>=0.11.10",
    "playwright>=1.64.0",
]

[tool.uv]
default-groups = ["dev", "scraper"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
