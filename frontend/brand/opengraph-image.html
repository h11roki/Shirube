<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        box-sizing: border-box;
        padding: 64px 72px;
        background-color: #f4efe4;
        background-image:
          linear-gradient(rgb(47 88 116 / 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgb(47 88 116 / 0.06) 1px, transparent 1px);
        background-size: 48px 48px;
        color: #2a2520;
        font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
      }
      .kicker {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.28em;
        color: #b23d27;
      }
      .plate {
        display: inline-block;
        margin-top: 36px;
        padding: 18px 40px;
        border: 1px solid #d8cfbe;
        border-radius: 12px;
        background: #24211d;
        color: #f4efe4;
        box-shadow: 0 8px 24px rgb(60 40 20 / 0.12);
        font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: 0.08em;
        line-height: 1.2;
      }
      .plate .to {
        margin-left: 14px;
        color: #e2775d;
      }
      .title {
        max-width: 740px;
        margin: 44px 0 0;
        font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
        font-size: 42px;
        font-weight: 800;
        line-height: 1.35;
      }
      .sub {
        max-width: 740px;
        margin: 16px 0 0;
        font-size: 24px;
        color: #6b6257;
      }
      .brand {
        position: absolute;
        left: 72px;
        bottom: 56px;
        font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      .brand small {
        margin-left: 12px;
        font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.3em;
        color: #6b6257;
      }
      .signpost {
        position: absolute;
        right: 90px;
        top: 110px;
        width: 260px;
        height: 314px;
      }
    </style>
  </head>
  <body>
    <div class="kicker">立命館大学 理工学部 電子情報工学科 ・ 非公式</div>
    <div class="plate">なりたい職業<span class="to">行</span></div>
    <h1 class="title">なりたい職業から、卒業までの道標を作る</h1>
    <p class="sub">
      シラバスから関係の深い授業を選び、理由をつけて、学期ごとの時間割に並べる
    </p>
    <div class="brand">shirube<small>道標</small></div>
    <svg class="signpost" viewBox="0 0 96 116" aria-hidden="true">
      <rect x="44" y="16" width="8" height="98" fill="#2a2520" opacity="0.85" />
      <path d="M14 20h62l12 11-12 11H14z" fill="#b23d27" />
      <path d="M82 52H22L8 63l14 11h60z" fill="#2f5874" />
      <text
        x="45"
        y="35"
        text-anchor="middle"
        fill="#f4efe4"
        font-family="Shippori Mincho, serif"
        font-size="11"
        font-weight="700"
      >
        卒業
      </text>
      <text
        x="51"
        y="67"
        text-anchor="middle"
        fill="#f4efe4"
        font-family="Shippori Mincho, serif"
        font-size="11"
        font-weight="700"
      >
        1 回生
      </text>
    </svg>
  </body>
</html>
